# Declares every image this repository builds.
#
# Each entry is one OS / OS-version. Ubuntu and Debian use the shared
# multi-stage apt/Dockerfile; the base image is the `full` stage and add-ons
# are further stages (e.g. `cmake-4`).
#
# Per-image fields:
#   context     build context directory  (default: <os>/<version>/base)
#   dockerfile  path to the Dockerfile  (default: <context>/Dockerfile)
#   build_args  map of --build-arg values, e.g. the version (default: none)
#   target      build stage for the BASE image (default: final stage)
#   addons      list of add-ons. Each add-on is a build STAGE (--target) in the
#               image's own Dockerfile (default: none)
# Ubuntu and Debian share apt/Dockerfile and differ only by DISTRO and VERSION;
# the base is the `full` stage and add-ons such as `cmake-4` are extra stages.
#
# Tag grammar (see README.md):
#   base  moving    : <os>-<version>                     e.g. ubuntu-24.04
#   base  immutable : <os>-<version>-<semver>            e.g. ubuntu-24.04-2.1.0
#   addon moving    : <os>-<version>-<addon>             e.g. ubuntu-24.04-cmake-4
#   addon immutable : <os>-<version>-<addon>-<semver>    e.g. ubuntu-24.04-cmake-4-2.1.0
#
# <semver> is THIS repository's version (the recipe), independent of the
# OpenModelica version. Pushing the git tag `<os>-<version>-<semver>` releases
# the base image and all of its add-ons (see RELEASING.md).

images:
  # Ubuntu and Debian share apt/Dockerfile; only DISTRO and VERSION differ.
  # The base image is the `full` stage; add-ons are further stages.

  - os: ubuntu
    version: "26.04"
    context: apt
    dockerfile: apt/Dockerfile
    target: full
    build_args:
      DISTRO: ubuntu
      VERSION: "26.04"
    addons:
      - rust
      - debug
      - omsimulator

  - os: ubuntu
    version: "24.04"
    context: apt
    dockerfile: apt/Dockerfile
    target: full
    build_args:
      DISTRO: ubuntu
      VERSION: "24.04"
    addons:
      - cmake-4
      - debug
      - omsimulator

  - os: ubuntu
    version: "22.04"
    context: apt
    dockerfile: apt/Dockerfile
    target: full
    build_args:
      DISTRO: ubuntu
      VERSION: "22.04"
    addons:
      - debug
      - omsimulator

  - os: debian
    version: "13"
    context: apt
    dockerfile: apt/Dockerfile
    target: full
    build_args:
      DISTRO: debian
      VERSION: "13"
      INTEL_OCL_PKGS: ""
    addons:
      - cmake-4
      - debug

  - os: debian
    version: "12"
    context: apt
    dockerfile: apt/Dockerfile
    target: full
    build_args:
      DISTRO: debian
      VERSION: "12"
    addons:
      - cmake-4
      - debug

  # Alpine has no OpenModelica apk repo; apk/Dockerfile installs the build
  # dependencies directly. VERSION selects the Alpine release.
  - os: alpine
    version: "3.24"
    context: apk
    dockerfile: apk/Dockerfile
    target: full
    build_args:
      VERSION: "3.24"
    addons:
      - omsimulator

  # RPM-based distros — the enterprise family (AlmaLinux, RHEL) and
  # Fedora — share rpm/Dockerfile; only DISTRO and VERSION differ. The base image
  # is the `full` stage. EPEL/CRB, Qt5/Qt6, autoconf 2.7x, gcc-toolset and the
  # Fedora-only deps are selected from ID/PLATFORM_ID at build time — see
  # rpm/Dockerfile.
  - os: almalinux
    version: "10"
    context: rpm
    dockerfile: rpm/Dockerfile
    target: full
    build_args:
      DISTRO: almalinux
      VERSION: "10"
    addons: []

  - os: almalinux
    version: "9"
    context: rpm
    dockerfile: rpm/Dockerfile
    target: full
    build_args:
      DISTRO: almalinux
      VERSION: "9"
    addons: []

  - os: fedora
    version: "44"
    context: rpm
    dockerfile: rpm/Dockerfile
    target: full
    build_args:
      DISTRO: fedora
      VERSION: "44"
    addons: []

  - os: fedora
    version: "43"
    context: rpm
    dockerfile: rpm/Dockerfile
    target: full
    build_args:
      DISTRO: fedora
      VERSION: "43"
    addons: []

  # Placeholders — not implemented yet. Uncomment and flesh out once the
  # corresponding Dockerfile is real, so CI starts building them.
  #
  # - os: arch
  #   version: "rolling"
  #   context: pacman
  #   dockerfile: pacman/Dockerfile
  #   target: full
  #   addons: []
